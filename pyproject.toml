[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chemql-python"
version = "0.1.0"
description = "A chemistry-focused query language and REPL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
chemql = "chemql:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chemql = ["data/*.json", "data/THIRD_PARTY_LICENSES/*.txt", "html/*.html"]
